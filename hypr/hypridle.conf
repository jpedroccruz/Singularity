general {
    lock_cmd = pkill -f '[s]creensaver.py'; pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
  timeout = 300
  on-timeout = pidof hyprlock || screensaver --launch
}

listener {
  timeout = 900
  on-timeout = pkill -f '[s]creensaver.py'; systemctl suspend
}